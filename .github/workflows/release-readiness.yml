name: Release readiness

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  minimum:
    name: Elixir 1.18.4 / OTP 27.0
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: 1.18.4
          otp-version: 27.0
          install-hex: false
      - run: mix local.hex 2.4.2 --force
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test

  quality:
    name: Quality / Elixir 1.20.0 / OTP 27.0
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: 1.20.0
          otp-version: 27.0
      - run: mix deps.get
      - run: mix check

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: 1.20.0
          otp-version: 27.0
      - run: mix deps.get
      - run: mix docs --warnings-as-errors

  package:
    name: Package audit and fixed consumer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: 1.20.0
          otp-version: 27.0
      - run: mix deps.get
      - run: scripts/release/audit_package.sh
      - run: scripts/release/consumer_fixed.sh

  apalache:
    name: Real Apalache 0.58.3
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: 1.20.0
          otp-version: 27.0
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"
      - run: mix deps.get
      - run: scripts/release/install_apalache.sh "$GITHUB_WORKSPACE/.apalache"
      - run: echo "$GITHUB_WORKSPACE/.apalache/bin" >> "$GITHUB_PATH"
      - run: mix test --include apalache test/victoria/apalache_integration_test.exs

  generated-consumer:
    name: Generated package consumer / Apalache 0.58.3
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: 1.20.0
          otp-version: 27.0
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"
      - run: mix deps.get
      - run: scripts/release/install_apalache.sh "$GITHUB_WORKSPACE/.apalache"
      - run: echo "$GITHUB_WORKSPACE/.apalache/bin" >> "$GITHUB_PATH"
      - run: scripts/release/consumer_generated.sh

  version-consistency:
    name: Tag / Mix / changelog consistency
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: 1.20.0
          otp-version: 27.0
      - run: mix deps.get
      - run: scripts/release/check_version.sh
