name: Victoria identical-resource aliasing experiment

on:
  pull_request:
    paths:
      - 'spikes/resource-alias/**'
      - 'spikes/http-vertical/**'
      - '.github/workflows/resource-alias-spike.yml'

permissions:
  contents: read

jobs:
  aliasing:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version-file: .tool-versions
      - uses: kokjinsam/setup-apalache@0fd33ad7d7b5a4d138b93e32abdd31fd6b6de3b5
        with:
          version-file: .tool-versions
      - name: Prove negative control and enforce distinct identities
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/victoria-alias-proof"
          mkdir -p "$ROOT"/{Alpha,Beta,baseline/src,logs}
          for order in Alpha Beta; do
            apalache-mc --run-dir="$ROOT/$order" simulate --init="Init$order" --next=Next --length=4 --max-run=1 --no-deadlock --output-traces=true spikes/resource-alias/IdenticalProjects.tla
          done
          ALPHA="$(find "$ROOT/Alpha" -name '*.itf.json' -print -quit)"
          BETA="$(find "$ROOT/Beta" -name '*.itf.json' -print -quit)"
          test -n "$ALPHA" && test -n "$BETA"
          python3 - "$ALPHA" "$BETA" <<'PY'
          import json,sys
          for path,want in [(sys.argv[1],["projectA","projectB","projectA","projectB"]),
                            (sys.argv[2],["projectB","projectA","projectB","projectA"])]:
            states=json.load(open(path))["states"]
            assert [s["operationId"] for s in states] == [
              "Initial","createProject","createProject","getProject","getProject"
            ]
            assert [s["resourceSymbol"] for s in states[1:]] == want
            assert all(s["requestBody"]["name"] == "Same" for s in states[1:3])
            print("REAL_IDENTICAL_RESOURCE_TRACE",want)
          PY

          cargo test --manifest-path spikes/http-vertical/Cargo.toml
          cargo build --manifest-path spikes/http-vertical/Cargo.toml
          NEW=spikes/http-vertical/target/debug/victoria-http-spike

          # Negative control: build the exact pre-guard Rust implementation.
          git fetch --no-tags --depth=1 origin 2fc9497d3c0c04682973d976ed44603239327225
          git show 2fc9497d3c0c04682973d976ed44603239327225:spikes/http-vertical/src/main.rs > "$ROOT/baseline/src/main.rs"
          git show 2fc9497d3c0c04682973d976ed44603239327225:spikes/http-vertical/Cargo.toml > "$ROOT/baseline/Cargo.toml"
          cargo build --manifest-path "$ROOT/baseline/Cargo.toml" --target-dir "$ROOT/baseline-target"
          OLD="$ROOT/baseline-target/debug/victoria-http-spike"
          API=spikes/resource-lifecycle/openapi.yaml
          run_case() {
            local name="$1" trace="$2" port="$3" fault="$4" cli="$5" expectation="$6"
            python3 spikes/resource-multi/server.py --port "$port" --fault "$fault" &
            local server=$!
            sleep 1
            local output="$ROOT/logs/$name.log"
            if [[ "$expectation" == "PASS" ]]; then
              if ! "$cli" --trace "$trace" --openapi "$API" --url "http://127.0.0.1:$port" > "$output" 2>&1; then
                cat "$output"
                kill "$server" 2>/dev/null || true
                wait "$server" || true
                echo "EXPECTED_PASS_FAILED: $name"; exit 1
              fi
              grep -F "PASS: 4 trace transitions conformed" "$output"
            else
              if "$cli" --trace "$trace" --openapi "$API" --url "http://127.0.0.1:$port" > "$output" 2>&1; then
                cat "$output"
                kill "$server" 2>/dev/null || true
                wait "$server" || true
                echo "DEFECT_ESCAPED: $name"; exit 1
              fi
              grep -F "$expectation" "$output"
              if grep -F "PASS step 3:" "$output"; then
                echo "FAILURE_WAS_TOO_LATE: $name"; exit 1
              fi
            fi
            kill "$server" 2>/dev/null || true
            wait "$server" || true
            echo "CASE_VERIFIED: $name"
          }

          # The unmodified runner cannot distinguish two identical named resources.
          run_case old-alias-escaped "$ALPHA" 8132 alias-create "$OLD" PASS
          run_case old-alias-escaped-reversed "$BETA" 8133 alias-create "$OLD" PASS
          # The new runner must reject aliasing immediately on the second POST.
          run_case new-alias-detected "$ALPHA" 8134 alias-create "$NEW" "CONFORMANCE FAIL: distinct formal resources projectA and projectB share a concrete identity"
          run_case new-alias-detected-reversed "$BETA" 8135 alias-create "$NEW" "CONFORMANCE FAIL: distinct formal resources projectB and projectA share a concrete identity"
          # Correct application still conforms, despite identical resource names.
          run_case new-correct-alpha "$ALPHA" 8136 none "$NEW" PASS
          run_case new-correct-beta "$BETA" 8137 none "$NEW" PASS
          echo "RESOURCE_ALIAS_EXPERIMENT_PASS"
