openapi: 3.1.0
info:
  title: Victoria resource lifecycle spike
  version: 0.0.1
components:
  securitySchemes:
    actorHeader:
      type: apiKey
      in: header
      name: X-Actor
paths:
  /projects:
    post:
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                type: object
                required: [id, name]
                properties:
                  id: {type: string}
                  name: {type: string}
          links:
            readProject:
              operationId: getProject
              parameters:
                path.project_id: "$response.body#/id"
            removeProject:
              operationId: deleteProject
              parameters:
                path.project_id: "$response.body#/id"
  /projects/{project_id}:
    parameters:
      - name: project_id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getProject
      parameters:
        - name: project_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Project found
          content:
            application/json:
              schema:
                type: object
                required: [id, name]
                properties:
                  id: {type: string}
                  name: {type: string}
        "404":
          description: Project absent
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: {type: string}
    delete:
      operationId: deleteProject
      parameters:
        - name: project_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: {type: boolean}
