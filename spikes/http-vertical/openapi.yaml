openapi: 3.1.0
info:
  title: Victoria disposable HTTP spike
  version: 0.0.1
components:
  securitySchemes:
    actorHeader:
      type: apiKey
      in: header
      name: X-Actor
paths:
  /members/member/deactivate:
    post:
      operationId: deactivateMember
      responses:
        "200":
          description: Member deactivated
          content:
            application/json:
              schema:
                type: object
                required: [active]
                properties:
                  active: {type: boolean}
  /projects:
    post:
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: {type: string}
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: {type: string}
    get:
      operationId: listProjects
      responses:
        "200":
          description: All projects
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count: {type: integer}
